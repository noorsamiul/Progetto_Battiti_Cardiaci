<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Progetto Battiti Cardiaci</title>
<!-- <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet"> -->
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #111118;
    --border: #1e1e2e;
    --accent: #6ee7b7;
    --accent2: #818cf8;
    --danger: #f87171;
    --text: #e2e8f0;
    --muted: #64748b;
    --card: #13131c;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Syne', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
  }

  /* Animated grid background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(110,231,183,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(110,231,183,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  .glow {
    position: fixed;
    width: 600px; height: 600px;
    border-radius: 50%;
    filter: blur(120px);
    pointer-events: none;
    z-index: 0;
  }
  .glow-1 { background: rgba(110,231,183,0.06); top: -200px; right: -100px; }
  .glow-2 { background: rgba(129,140,248,0.06); bottom: -200px; left: -100px; }

  .wrapper {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 480px;
    padding: 24px;
  }

  .logo {
    text-align: center;
    margin-bottom: 40px;
  }
  .logo-mark {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -0.5px;
  }
  .logo-icon {
    width: 36px; height: 36px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    overflow: hidden;
  }

  .tabs {
    display: grid;
    grid-template-columns: 1fr 1fr;
    border-bottom: 1px solid var(--border);
  }
  .tab-btn {
    padding: 18px;
    background: none;
    border: none;
    color: var(--muted);
    font-family: 'Syne', sans-serif;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.5px;
    cursor: pointer;
    transition: all 0.2s;
    text-transform: uppercase;
    position: relative;
  }
  .tab-btn.active {
    color: var(--accent);
    background: rgba(110,231,183,0.04);
  }
  .tab-btn.active::after {
    content: '';
    position: absolute;
    bottom: -1px; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
  }

  .form-panel {
    padding: 36px;
    display: none;
    animation: fadeSlide 0.3s ease;
  }
  .form-panel.active { display: block; }

  @keyframes fadeSlide {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .form-title {
    font-size: 26px;
    font-weight: 800;
    margin-bottom: 6px;
    letter-spacing: -0.5px;
  }
  .form-subtitle {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 30px;
  }

  .field {
    margin-bottom: 20px;
  }
  .field label {
    display: block;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .input-wrap {
    position: relative;
  }
  .input-wrap .icon {
    position: absolute;
    left: 14px; top: 50%;
    transform: translateY(-50%);
    font-size: 16px;
    opacity: 0.4;
    pointer-events: none;
  }
  .field input {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 13px 14px 13px 42px;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 14px;
    outline: none;
    transition: all 0.2s;
  }
  .field input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(110,231,183,0.1);
  }
  .field input::placeholder { color: var(--muted); opacity: 0.6; }

  .password-toggle {
    position: absolute;
    right: 14px; top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 14px;
    padding: 4px;
    transition: color 0.2s;
  }
  .password-toggle:hover { color: var(--accent); }

  .strength-bar {
    margin-top: 8px;
    display: none;
  }
  .strength-bar.visible { display: block; }
  .strength-track {
    height: 3px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
    margin-bottom: 4px;
  }
  .strength-fill {
    height: 100%;
    width: 0%;
    border-radius: 2px;
    transition: all 0.3s;
  }
  .strength-label {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--muted);
  }

  .submit-btn {
    width: 100%;
    padding: 15px;
    background: linear-gradient(135deg, var(--accent), #34d399);
    border: none;
    border-radius: 12px;
    color: #0a0a0f;
    font-family: 'Syne', sans-serif;
    font-size: 15px;
    font-weight: 800;
    letter-spacing: 0.5px;
    cursor: pointer;
    transition: all 0.2s;
    margin-top: 8px;
    position: relative;
    overflow: hidden;
  }
  .submit-btn:hover { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(110,231,183,0.25); }
  .submit-btn:active { transform: translateY(0); }
  .submit-btn.loading { opacity: 0.7; cursor: not-allowed; }

  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 24px 0;
  }
  .divider-line { flex: 1; height: 1px; background: var(--border); }
  .divider-text { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--muted); }

  .toast {
    display: none;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    border-radius: 10px;
    margin-bottom: 20px;
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    animation: fadeSlide 0.3s ease;
  }
  .toast.success { background: rgba(110,231,183,0.1); border: 1px solid rgba(110,231,183,0.2); color: var(--accent); }
  .toast.error { background: rgba(248,113,113,0.1); border: 1px solid rgba(248,113,113,0.2); color: var(--danger); }
  .toast.show { display: flex; }

  .code-block {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 16px;
  }
  .code-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    background: rgba(129,140,248,0.05);
  }
  .code-lang {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--accent2);
    font-weight: 500;
  }
  .code-copy {
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    padding: 3px 10px;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .code-copy:hover { border-color: var(--accent); color: var(--accent); }
  pre {
    padding: 16px;
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    line-height: 1.7;
    overflow-x: auto;
    color: #94a3b8;
  }
  .kw { color: var(--accent2); }
  .str { color: var(--accent); }
  .cm { color: var(--muted); font-style: italic; }
  .fn { color: #fbbf24; }

  .step-grid {
    display: grid;
    gap: 12px;
    margin-top: 16px;
  }
  .step-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    display: flex;
    gap: 14px;
    align-items: flex-start;
  }
  .step-num {
    width: 28px; height: 28px;
    border-radius: 8px;
    background: linear-gradient(135deg, rgba(110,231,183,0.15), rgba(129,140,248,0.15));
    border: 1px solid rgba(110,231,183,0.2);
    display: flex; align-items: center; justify-content: center;
    font-size: 13px;
    font-weight: 800;
    color: var(--accent);
    flex-shrink: 0;
  }
  .step-content h4 {
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 4px;
  }
  .step-content p {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    line-height: 1.6;
  }
</style>
</head>
<body>

<div class="glow glow-1"></div>
<div class="glow glow-2"></div>

<div class="wrapper">
  <!-- Logo -->
  <div class="logo">
    <div class="logo-mark">
      <div class="logo-icon">🔐</div>
      AuthSystem
    </div>
  </div>

  <!-- Auth Card -->
  <div class="card">
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('login')">Login</button>
      <button class="tab-btn" onclick="switchTab('register')">Registrati</button>
    </div>

    <!-- LOGIN -->
    <div id="panel-login" class="form-panel active">
      <div class="form-title">Bentornato 👋</div>
      <div class="form-subtitle">// accedi al tuo account</div>

      <div id="toast-login" class="toast"></div>

      <div class="field">
        <label>Email</label>
        <div class="input-wrap">
          <span class="icon">✉️</span>
          <input type="email" id="login-email" placeholder="mario@example.com">
        </div>
      </div>

      <div class="field">
        <label>Password</label>
        <div class="input-wrap">
          <span class="icon">🔑</span>
          <input type="password" id="login-password" placeholder="••••••••">
          <button class="password-toggle" onclick="togglePwd('login-password', this)">👁</button>
        </div>
      </div>

      <button class="submit-btn" onclick="handleLogin()">Accedi</button>
    </div>

    <!-- REGISTER -->
    <div id="panel-register" class="form-panel">
      <div class="form-title">Crea account</div>
      <div class="form-subtitle">// registrazione nuovo utente</div>

      <div id="toast-register" class="toast"></div>

      <div class="field">
        <label>Nome completo</label>
        <div class="input-wrap">
          <span class="icon">👤</span>
          <input type="text" id="reg-name" placeholder="Mario Rossi">
        </div>
      </div>

      <div class="field">
        <label>Email</label>
        <div class="input-wrap">
          <span class="icon">✉️</span>
          <input type="email" id="reg-email" placeholder="mario@example.com">
        </div>
      </div>

      <div class="field">
        <label>Password</label>
        <div class="input-wrap">
          <span class="icon">🔑</span>
          <input type="password" id="reg-password" placeholder="min. 8 caratteri" oninput="checkStrength(this)">
          <button class="password-toggle" onclick="togglePwd('reg-password', this)">👁</button>
        </div>
        <div class="strength-bar" id="strength-bar">
          <div class="strength-track">
            <div class="strength-fill" id="strength-fill"></div>
          </div>
          <div class="strength-label" id="strength-label">Sicurezza password</div>
        </div>
      </div>

      <div class="field">
        <label>Conferma password</label>
        <div class="input-wrap">
          <span class="icon">🔒</span>
          <input type="password" id="reg-confirm" placeholder="••••••••">
        </div>
      </div>

      <button class="submit-btn" onclick="handleRegister()">Crea account</button>
    </div>
  </div>

 

    
<script>
  // --- Tab switching ---
  function switchTab(tab) {
    document.querySelectorAll('.tab-btn').forEach((b,i) => b.classList.toggle('active', (i === 0) === (tab === 'login')));
    document.getElementById('panel-login').classList.toggle('active', tab === 'login');
    document.getElementById('panel-register').classList.toggle('active', tab === 'register');
  }

  // --- Password toggle ---
  function togglePwd(id, btn) {
    const inp = document.getElementById(id);
    inp.type = inp.type === 'password' ? 'text' : 'password';
    btn.textContent = inp.type === 'password' ? '👁' : '🙈';
  }

  // --- Password strength ---
  function checkStrength(input) {
    const bar = document.getElementById('strength-bar');
    const fill = document.getElementById('strength-fill');
    const label = document.getElementById('strength-label');
    const val = input.value;

    if (!val) { bar.classList.remove('visible'); return; }
    bar.classList.add('visible');

    let score = 0;
    if (val.length >= 8) score++;
    if (/[A-Z]/.test(val)) score++;
    if (/[0-9]/.test(val)) score++;
    if (/[^A-Za-z0-9]/.test(val)) score++;

    const levels = [
      { pct: '20%', color: '#f87171', text: 'Molto debole' },
      { pct: '45%', color: '#fb923c', text: 'Debole' },
      { pct: '65%', color: '#facc15', text: 'Discreta' },
      { pct: '85%', color: '#4ade80', text: 'Forte' },
      { pct: '100%', color: '#6ee7b7', text: 'Molto forte' },
    ];
    const lvl = levels[score] || levels[0];
    fill.style.width = lvl.pct;
    fill.style.background = lvl.color;
    label.textContent = lvl.text;
    label.style.color = lvl.color;
  }

  // --- Toast ---
  function showToast(id, type, msg) {
    const t = document.getElementById(id);
    t.className = `toast ${type} show`;
    t.textContent = (type === 'success' ? '✅ ' : '❌ ') + msg;
    setTimeout(() => t.classList.remove('show'), 3500);
  }

  // --- Fake DB (localStorage) ---
  function getUsers() {
    return JSON.parse(localStorage.getItem('auth_users') || '[]');
  }
  function saveUsers(u) {
    localStorage.setItem('auth_users', JSON.stringify(u));
  }
  function fakeHash(pw) {
    return '$2b$12$' + btoa(pw).substring(0, 22) + '...';
  }

  // --- Register ---
  function handleRegister() {
    const name  = document.getElementById('reg-name').value.trim();
    const email = document.getElementById('reg-email').value.trim();
    const pw    = document.getElementById('reg-password').value;
    const conf  = document.getElementById('reg-confirm').value;

    if (!name || !email || !pw) return showToast('toast-register', 'error', 'Compila tutti i campi');
    if (pw !== conf) return showToast('toast-register', 'error', 'Le password non coincidono');
    if (pw.length < 8) return showToast('toast-register', 'error', 'Password troppo corta (min 8 caratteri)');

    const users = getUsers();
    if (users.find(u => u.email === email)) return showToast('toast-register', 'error', 'Email già registrata');

    users.push({ name, email, hash: fakeHash(pw), created: new Date().toLocaleDateString('it-IT') });
    saveUsers(users);
    showToast('toast-register', 'success', 'Account creato con successo!');
    document.getElementById('reg-name').value = '';
    document.getElementById('reg-email').value = '';
    document.getElementById('reg-password').value = '';
    document.getElementById('reg-confirm').value = '';
    document.getElementById('strength-bar').classList.remove('visible');
    setTimeout(() => switchTab('login'), 1500);
  }

  // --- Login ---
  function handleLogin() {
    const email = document.getElementById('login-email').value.trim();
    const pw    = document.getElementById('login-password').value;

    if (!email || !pw) return showToast('toast-login', 'error', 'Compila tutti i campi');

    const users = getUsers();
    const user = users.find(u => u.email === email);

    // Demo: confronto semplificato (in produzione → bcrypt.compare() sul server)
    const expectedHash = fakeHash(pw);
    if (!user || user.hash !== expectedHash) {
      return showToast('toast-login', 'error', 'Credenziali non valide');
    }
    showToast('toast-login', 'success', `Benvenuto, ${user.name}! 🎉`);
    document.getElementById('login-email').value = '';
    document.getElementById('login-password').value = '';
  }

  // --- Copy code ---
  function copyCode(btn, id) {
    const text = document.getElementById(id).innerText;
    navigator.clipboard.writeText(text).then(() => {
      btn.textContent = '✓ Copiato';
      setTimeout(() => btn.textContent = 'Copia', 2000);
    });
  }
</script>
</body>
</html>
